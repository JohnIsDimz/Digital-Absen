<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Apsen - Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html{overflow-x:hidden; width:100vw} body{overflow-x:hidden; width:100vw; touch-action:pan-y; background:#F5F5DC; font-family:'Plus Jakarta Sans'} h1,h2{font-family:'Space Grotesk'} .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24} .truncate-ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
</style>
</head>
<body class="min-h-screen flex justify-center">
<div class="w-full max-w-[420px] bg-[#F5F5DC] min-h-screen border-x-[3px] border-black flex flex-col pb-20 overflow-x-hidden relative">

<header class="bg-white border-b-[3px] border-black p-4 sticky top-0 z-50 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-9 h-9 bg-[#FFE600] border-[2.5px] border-black rounded-xl flex items-center justify-center font-black text-sm">DA</div>
<span class="font-black text-sm uppercase">Settings</span>
</div>
<a href="/" class="border-[2px] border-black px-3 py-1.5 rounded-full text-[11px] font-black bg-[#FFE600]">Home</a>
</header>

<div class="bg-black text-white p-3 flex justify-between items-center text-[11px] font-black min-h-[40px]" style="font-variant-numeric:tabular-nums">
<span id="realTanggal" class="truncate-ellipsis max-w-[60%]">Memuat...</span>
<span id="liveClock" class="tabular-nums min-w-[90px] text-right">00:00:00 WIB</span>
</div>

<main class="p-5 flex flex-col gap-5 flex-1">

<div class="bg-[#67FFB7] border-[3px] border-black rounded-[16px] p-5 [box-shadow:6px_6px_0px_#000]">
<div class="flex justify-between items-start">
<div>
<h1 class="font-black text-[20px] leading-[22px] uppercase">Settings<br/>Digital Apsen</h1>
<p class="text-[11px] mt-2 font-bold opacity-70">Atur lokasi sekolah & tahun ajaran</p>
</div>
<div class="w-12 h-12 bg-white border-[2.5px] border-black rounded-xl flex items-center justify-center"><span class="material-symbols-outlined">settings</span></div>
</div>
<div class="mt-3 flex gap-2">
<span class="bg-black text-white text-[10px] font-black px-3 py-1 rounded-full">2026/2027</span>
<span class="bg-white border-[2px] border-black text-[10px] font-black px-3 py-1 rounded-full">Lokasi Sekolah</span>
</div>
</div>

<div class="bg-white border-[3px] border-black rounded-[16px] p-5 [box-shadow:4px_4px_0px_#000]">
<h2 class="font-black text-[12px] uppercase flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">location_on</span> Lokasi Saat Ini</h2>
<div id="currentSettings" class="mt-3 space-y-2 text-[12px] bg-[#F5F5DC] border-[2px] border-black p-3 rounded-xl">Memuat settings...</div>
<button onclick="loadSettingsReal()" class="mt-3 w-full bg-black text-white py-2.5 rounded-full font-black text-[11px] uppercase">Reload</button>
</div>

<div class="bg-white border-[3px] border-black rounded-[16px] p-5 [box-shadow:4px_4px_0px_#000]">
<h2 class="font-black text-[12px] uppercase flex items-center gap-2"><span class="material-symbols-outlined text-[18px]">edit_location</span> Ganti Lokasi & Tahun</h2>
<form id="settingsForm" class="mt-4 space-y-3">
<div>
<label class="text-[10px] font-black uppercase opacity-60">Nama Sekolah</label>
<input id="sekolahNama" placeholder="SMK N 1 BANDUNG" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
<div>
<label class="text-[10px] font-black uppercase opacity-60">Alamat Sekolah</label>
<input id="sekolahAlamat" placeholder="Jl. Telekomunikasi No.1" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-[10px] font-black uppercase opacity-60">Latitude</label>
<input id="lat" placeholder="-6.914744" type="number" step="any" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
<div>
<label class="text-[10px] font-black uppercase opacity-60">Longitude</label>
<input id="lng" placeholder="107.60981" type="number" step="any" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text-[10px] font-black uppercase opacity-60">Radius (meter)</label>
<input id="radiusMeter" placeholder="50" type="number" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
<div>
<label class="text-[10px] font-black uppercase opacity-60">Tahun Ajaran</label>
<input id="tahunAjaran" placeholder="2026/2027" class="w-full border-[2.5px] border-black p-3 rounded-xl text-sm font-bold mt-1 bg-white"/>
</div>
</div>
<button type="submit" class="w-full bg-[#FFE600] border-[3px] border-black py-3 font-black uppercase rounded-full text-sm [box-shadow:3px_3px_0px_#000]">Update Settings</button>
</form>
<div id="settingsResult" class="hidden mt-3 bg-black text-[#00FF88] p-3 text-[11px] rounded-xl font-mono max-h-32 overflow-auto border-2 border-black"></div>
</div>

</main>

<nav class="fixed bottom-0 w-full max-w-[420px] bg-white border-t-[3px] border-black flex justify-around py-2 z-50 left-1/2 -translate-x-1/2">
<a href="/" class="flex flex-col items-center opacity-60 px-3 py-1"><span class="material-symbols-outlined text-[20px]">home</span><span class="text-[9px] font-bold uppercase">Home</span></a>
<a href="/dashboard-siswa.html" class="flex flex-col items-center opacity-60 px-3 py-1"><span class="material-symbols-outlined text-[20px]">dashboard</span><span class="text-[9px] font-bold uppercase">Dash</span></a>
<a href="/scan.html" class="flex flex-col items-center opacity-60 px-3 py-1"><span class="material-symbols-outlined text-[20px]">qr_code_scanner</span><span class="text-[9px] font-bold uppercase">Scan</span></a>
<a href="/rekap.html" class="flex flex-col items-center opacity-60 px-3 py-1"><span class="material-symbols-outlined text-[20px]">analytics</span><span class="text-[9px] font-bold uppercase">Rekap</span></a>
<a href="/settings.html" class="flex flex-col items-center bg-[#FFE600] border-[2px] border-black rounded-xl px-4 py-1"><span class="material-symbols-outlined text-[20px]">settings</span><span class="text-[9px] font-black uppercase">Settings</span></a>
</nav>

</div>

<script>
function truncateText(t,m){ if(!t) return '-'; return t.length<=m?t:t.substring(0,m).trim()+'...'; }

function updateDateTime(){
  const now = new Date();
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const tgl = `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;
  const jam = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('realTanggal').textContent = tgl;
  document.getElementById('liveClock').textContent = jam + ' WIB';
}
updateDateTime();
setInterval(updateDateTime,1000);

async function loadSettingsReal(){
 try{
  const r=await fetch('/api/settings');
  const d=await r.json();
  if(d.success){
   document.getElementById('currentSettings').innerHTML=`
    <p><b>Sekolah:</b> ${truncateText(d.data.sekolahNama,22)}</p>
    <p><b>Alamat:</b> ${truncateText(d.data.sekolahAlamat,24)}</p>
    <p><b>Koordinat:</b> ${d.data.lat}, ${d.data.lng}</p>
    <p><b>Radius:</b> ${d.data.radiusMeter}m</p>
    <p><b>Tahun:</b> ${d.data.tahunAjaran} - ${d.data.semester}</p>
    <p><b>Jam:</b> ${d.data.jamMasuk} - Toleransi ${d.data.batasToleransi}</p>`;
   document.getElementById('sekolahNama').value=d.data.sekolahNama;
   document.getElementById('sekolahAlamat').value=d.data.sekolahAlamat;
   document.getElementById('lat').value=d.data.lat;
   document.getElementById('lng').value=d.data.lng;
   document.getElementById('radiusMeter').value=d.data.radiusMeter;
   document.getElementById('tahunAjaran').value=d.data.tahunAjaran;
  }
 }catch(e){
   document.getElementById('currentSettings').innerHTML='<p class="text-red-600 text-[11px]">Gagal load. Yuk setup dulu di <a href="/setup.html" class="underline font-black">Setup</a></p>';
 }
}





document.getElementById('settingsForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const body={};
 if(sekolahNama.value) body.sekolahNama=sekolahNama.value;
 if(sekolahAlamat.value) body.sekolahAlamat=sekolahAlamat.value;
 if(lat.value) body.lat=parseFloat(lat.value);
 if(lng.value) body.lng=parseFloat(lng.value);
 if(radiusMeter.value) body.radiusMeter=parseInt(radiusMeter.value);
 if(tahunAjaran.value) body.tahunAjaran=tahunAjaran.value;
 try{
  const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  const el=document.getElementById('settingsResult');
  el.classList.remove('hidden');
  el.textContent=JSON.stringify(d,null,2);
  if(d.success) { alert('Settings berhasil diperbarui!'); loadSettingsReal(); }
 }catch(err){ alert('Gagal: '+err.message); }
});

loadSettingsReal();

</script>
</body>
</html>
