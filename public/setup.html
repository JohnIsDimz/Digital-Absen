<!DOCTYPE html>
<html lang="id" class="overflow-x-hidden">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Apsen - Setup Awal 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html{overflow-x:hidden; width:100vw} body{overflow-x:hidden; width:100vw; touch-action:pan-y; overscroll-behavior-x:contain; position:relative} .no-scroll-x{overflow-x:hidden; max-width:100vw}
body{font-family:'Plus Jakarta Sans'; background:#F5F5DC} h1,h2{font-family:'Space Grotesk'}html,body{overflow-x:hidden; max-width:100vw; position:relative} *{max-width:100%; box-sizing:border-box} body{overscroll-behavior-x:none}.truncate-ellipsis{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%} .truncate-2{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px; display:inline-block} .truncate-long{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px}</style>
</head>
<body class="min-h-screen flex justify-center overflow-x-hidden w-full max-w-[100vw] md:bg-[#E8E0C8]">
<div class="w-full max-w-[480px] bg-[#F5F5DC] min-h-screen border-x-[3px] border-black flex flex-col overflow-x-hidden relative max-w-[100vw]">

<header class="bg-white border-b-[3px] border-black p-4 sticky top-0 z-50 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-9 h-9 bg-[#FFE600] border-[2.5px] border-black rounded-xl flex items-center justify-center font-black text-sm">DA</div>
<span class="font-black text-sm uppercase">Digital Apsen Setup</span>
</div>
<a href="/settings.html" class="border-[2.5px] border-black p-3 rounded-xl bg-white font-black"><span class="material-symbols-outlined text-[16px]">settings</span><br/>Settings</a>
</div>

</main>

</div>

<script>
function updateDateTime(){
 const now = new Date();
 const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
 const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 const tgl = `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;
 const jam = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 document.getElementById('realTanggal').textContent = tgl;
 document.getElementById('liveClock').textContent = jam + ' WIB';
}
updateDateTime();
setInterval(updateDateTime,1000);

document.getElementById('setupForm').addEventListener('submit', async e=>{
 e.preventDefault();
 const btn = e.target.querySelector('button');
 btn.textContent = 'Memproses...';
 btn.disabled = true;
 const body={
 kelasNama: document.getElementById('kelasNama').value,
 tahunAjaran: document.getElementById('tahunAjaran').value,
 semester: document.getElementById('semester').value,
 guruNama: document.getElementById('guruNama').value,
 guruNip: document.getElementById('guruNip').value,
 guruPassword: document.getElementById('guruPassword').value,
 sekolahNama: document.getElementById('sekolahNama').value||undefined,
 sekolahAlamat: document.getElementById('sekolahAlamat').value||undefined,
 lat: document.getElementById('lat').value?parseFloat(document.getElementById('lat').value):undefined,
 lng: document.getElementById('lng').value?parseFloat(document.getElementById('lng').value):undefined
 };
 try{
 const r=await fetch('/api/setup/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 const el=document.getElementById('result');
 el.classList.remove('hidden');
 el.textContent=JSON.stringify(d,null,2);
 if(d.success){
  document.getElementById('successBox').classList.remove('hidden');
  document.getElementById('successData').innerHTML=`
  <p><b>Kelas:</b> ${d.data.kelas.nama} - <span class="bg-black text-[#FFE600] px-2 py-0.5 rounded">${d.data.kelas.kodeUndangan}</span> - ${d.data.kelas.tahunAjaran}</p>
  <p><b>Guru:</b> ${d.data.guru.nama} - NIP ${d.data.guru.nip}</p>
  <p><b>Sekolah:</b> ${d.data.settings.sekolahNama} - ${d.data.settings.lat},${d.data.settings.lng}</p>
  <p class="mt-2 bg-black text-[#FFE600] p-2 rounded text-center">KODE UNDANGAN: ${d.data.kelas.kodeUndangan} - CATAT UNTUK LOGIN SISWA!</p>`;
 }
 }catch(err){
 alert('Gagal: '+err.message);
 }finally{
 btn.textContent = 'Buat Data Real - Digital Apsen';
 btn.disabled = false;
 }
});
</script>
<script src="/js/auth-guard.js"></script>
</body>
</html>
